# Reproducible pipeline: validate -> prepare -> train -> predict
#
# Each stage declares what it reads and what it writes, so `dvc repro` re-runs exactly
# the stages a change can affect and no others. The split between `prepare` and `train`
# is the one that earns its keep: aggregation is expensive and reads no parameters, so
# editing a search space re-runs the search alone rather than re-aggregating ~57 M
# child rows.
#
# `params:` lists the params.yaml sections a stage depends on. A stage with no `params:`
# entry genuinely reads none — that is a claim about the code, not an omission.

stages:

  # Raw data contract. Nothing is cleaned, transformed or trained here, so a broken
  # input fails in its own stage naming the table and the offending values.
  validate:
    cmd: python scripts/validate_data.py
    deps:
      - scripts/validate_data.py
      - src/data/data_validation.py
      - src/data/data_loader.py
      - config/config.py
      - data/raw
    outs:
      - artifacts/metrics/raw_data_validation.json:
          cache: false

  # Relational aggregation + domain features for both the training and scoring
  # applicant tables, built by the same functions with only the applicant table
  # switched. Depends on the validation report so the contract is checked first.
  prepare:
    cmd: python scripts/prepare_data.py
    deps:
      - scripts/prepare_data.py
      - src/data/data_preparation.py
      - src/data/data_cleaning.py
      - src/data/data_loader.py
      - src/data/data_validation.py
      - src/features/feature_engineering.py
      - config/config.py
      - data/raw
      - artifacts/metrics/raw_data_validation.json
    outs:
      - data/processed/train_features.parquet
      - data/processed/test_features.parquet
      - data/processed/prepare_report.json:
          cache: false

  # Split -> baseline + leak-free CV tuning -> validation champion -> frozen threshold
  # -> single test read -> serialized champion pipeline.
  train:
    cmd: python scripts/train.py
    deps:
      - scripts/train.py
      - src/models/train.py
      - src/models/tune.py
      - src/models/selection.py
      - src/models/evaluation.py
      - src/models/threshold.py
      - src/models/serialization.py
      # Imported directly by scripts/train.py to record the run and write the
      # run_information.json handoff. Previously missing, which meant a change to either
      # left DVC reporting the train stage up to date while its outputs came from the
      # old code.
      - src/tracking/mlflow_tracker.py
      - src/models/register_model.py
      - src/features/data_preprocessing.py
      - src/data/data_preparation.py
      - src/utils/config_loader.py
      - config/config.py
      - data/processed/train_features.parquet
      - data/processed/prepare_report.json
    params:
      - data
      - preprocessing
      - tuning
      - selection
      - threshold
      - models
    outs:
      - models/champion_pipeline.joblib
      - artifacts/deployment_meta.json
      # Handoff to the register stage: which tracked run produced the champion and
      # whether it was approved. Written even with tracking disabled, so the stage
      # contract holds either way.
      - artifacts/run_information.json:
          cache: false
      - artifacts/metrics/validation_leaderboard.csv:
          cache: false
      - artifacts/metrics/tuning_summary.csv:
          cache: false
      - artifacts/metrics/test_metrics.csv:
          cache: false
    metrics:
      - artifacts/metrics/test_metrics.json:
          cache: false

  # Files the trained champion into the MLflow Model Registry, aliased by whether it
  # passed its quality gates. Reads the train stage's handoff file, no data and no model.
  #
  # Deliberately a leaf, not a link in the chain to `predict`: batch scoring loads the
  # local champion artifact, so a registry outage cannot stop the pipeline producing
  # predictions. The registry itself is external state DVC cannot restore, so the stage
  # outputs its own record of what it did rather than pretending to cache the registry.
  register:
    cmd: python scripts/register_model.py
    deps:
      - scripts/register_model.py
      - src/models/register_model.py
      - src/tracking/mlflow_tracker.py
      - src/utils/config_loader.py
      - config/config.py
      - artifacts/run_information.json
    # The one stage that genuinely reads the `mlflow:` section, so renaming the
    # registered model or swapping an alias re-runs registration — without touching
    # training, which reads none of it.
    params:
      - mlflow
    outs:
      - artifacts/registry_record.json:
          cache: false

  # Scores the prepared application_test features with the frozen champion. No training,
  # no refitting, no threshold retuning — it depends on the champion artifact and its
  # metadata, so it re-runs when either changes.
  predict:
    cmd: python scripts/predict.py
    deps:
      - scripts/predict.py
      - src/inference/predictor.py
      - src/features/data_preprocessing.py
      - src/models/serialization.py
      - config/config.py
      - models/champion_pipeline.joblib
      - artifacts/deployment_meta.json
      - data/processed/test_features.parquet
    outs:
      - artifacts/predictions/test_predictions.csv

  # SHAP explanations for the model the registry says is approved. Inference-only: it
  # loads the champion through its alias, transforms with the already-fitted
  # preprocessor, and fits nothing — so re-running it can never change the model.
  #
  # Depends on the register stage's record rather than on mlflow.db. The database is
  # large, binary and rewritten by every run, which would make it a useless dependency
  # hash; registry_record.json changes exactly when the registered version does, and
  # depending on it is also what orders this stage after `register`.
  explain:
    cmd: python scripts/explain.py
    deps:
      - scripts/explain.py
      - src/explainability/shap_explainer.py
      - src/features/data_preprocessing.py
      - src/data/data_preparation.py
      - src/utils/config_loader.py
      - config/config.py
      - artifacts/registry_record.json
      - artifacts/deployment_meta.json
      - data/processed/train_features.parquet
    params:
      - explainability
      - data
      - mlflow
    outs:
      - artifacts/explainability/global_feature_importance.csv:
          cache: false
      - artifacts/explainability/local_explanations.json:
          cache: false
      - artifacts/explainability/explanation_report.json:
          cache: false
      - reports/figures/shap_summary.png:
          cache: false
      - reports/figures/shap_bar.png:
          cache: false
      # A directory, because the per-applicant filenames carry their SK_ID_CURR and
      # cannot be enumerated ahead of the run. Its own subdirectory rather than
      # reports/figures itself: DVC takes ownership of a declared directory and deletes
      # what it did not write, which removed the git-tracked reports/figures/.gitkeep.
      # Owning a subdirectory also means a sample change cleans up the previous run's
      # plots instead of leaving them to be mistaken for current ones.
      - reports/figures/shap_local:
          cache: false
